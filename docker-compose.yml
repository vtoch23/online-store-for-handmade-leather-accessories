version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: leather-store-postgres
    environment:
      POSTGRES_DB: leather_store_db
      POSTGRES_USER: leather_store
      POSTGRES_PASSWORD: leather_store_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"  # Changed to 5434 to avoid conflict with CryptoTracker (5433)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leather_store"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leather-store-backend
    environment:
      DATABASE_URL: postgresql://leather_store:leather_store_password@db:5432/leather_store_db
      SECRET_KEY: your-secret-key-change-this-in-production
      BACKEND_CORS_ORIGINS: '["http://localhost:4200", "http://localhost:8080"]'
    ports:
      - "8001:8000"  # Changed to 8001 to avoid conflict with CryptoTracker (8000)
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leather-store-frontend
    ports:
      - "8080:80"  # Changed to 8080 for easier access (http://localhost:8080)
    depends_on:
      - backend
    environment:
      - API_URL=http://localhost:8001

volumes:
  postgres_data:
