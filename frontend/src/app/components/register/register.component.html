<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-leather-brown">
        Create your account
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Already have an account?
        <a routerLink="/login" class="font-medium text-leather-accent hover:text-opacity-80">
          Sign in
        </a>
      </p>
    </div>

    <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-800 rounded-lg p-4">
      {{ error }}
    </div>

    <form class="mt-8 space-y-6" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="full_name" class="block text-sm font-medium text-gray-700 mb-1">
            Full Name (optional)
          </label>
          <input
            id="full_name"
            type="text"
            formControlName="full_name"
            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-leather-accent focus:border-leather-accent sm:text-sm"
            placeholder="John Doe">
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
            Email address *
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-leather-accent focus:border-leather-accent sm:text-sm"
            [class.border-red-500]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
            placeholder="you@example.com">
          <p *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
             class="mt-1 text-sm text-red-600">
            Please enter a valid email address
          </p>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            Password *
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-leather-accent focus:border-leather-accent sm:text-sm"
            [class.border-red-500]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
            placeholder="Minimum 6 characters">
          <p *ngIf="registerForm.get('password')?.hasError('required') && registerForm.get('password')?.touched"
             class="mt-1 text-sm text-red-600">
            Password is required
          </p>
          <p *ngIf="registerForm.get('password')?.hasError('minlength') && registerForm.get('password')?.touched"
             class="mt-1 text-sm text-red-600">
            Password must be at least 6 characters
          </p>
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">
            Confirm Password *
          </label>
          <input
            id="confirmPassword"
            type="password"
            formControlName="confirmPassword"
            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-leather-accent focus:border-leather-accent sm:text-sm"
            [class.border-red-500]="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched"
            placeholder="Confirm your password">
          <p *ngIf="registerForm.get('confirmPassword')?.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched"
             class="mt-1 text-sm text-red-600">
            Passwords do not match
          </p>
        </div>
      </div>

      <div>
        <button
          type="submit"
          [disabled]="registerForm.invalid || loading"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-leather-brown hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-leather-accent disabled:opacity-50 disabled:cursor-not-allowed transition-all">
          {{ loading ? 'Creating account...' : 'Create account' }}
        </button>
      </div>
    </form>
  </div>
</div>
