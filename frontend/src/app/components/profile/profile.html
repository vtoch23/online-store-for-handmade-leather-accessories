<div class="min-h-screen bg-stone-50 py-12">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-stone-900">My Profile</h1>
      <p class="mt-2 text-stone-600">Manage your account information and preferences</p>
    </div>

    <!-- Success/Error Messages -->
    <div *ngIf="successMessage" class="mb-6 bg-green-50 border border-green-200 text-green-800 rounded-lg p-4">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="mb-6 bg-red-50 border border-red-200 text-red-800 rounded-lg p-4">
      {{ errorMessage }}
    </div>

    <div class="space-y-6">
      <!-- Personal Information Section -->
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold text-stone-900 mb-6">Personal Information</h2>

        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Full Name -->
            <div>
              <label for="full_name" class="block text-sm font-medium text-stone-700 mb-2">
                Full Name <span class="text-red-500">*</span>
              </label>
              <input
                id="full_name"
                type="text"
                formControlName="full_name"
                class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-leather-primary focus:border-transparent"
                [class.border-red-500]="profileForm.get('full_name')?.invalid && profileForm.get('full_name')?.touched"
              />
              <p *ngIf="profileForm.get('full_name')?.invalid && profileForm.get('full_name')?.touched"
                 class="mt-1 text-sm text-red-600">
                Full name is required
              </p>
            </div>

            <!-- Email (disabled) -->
            <div>
              <label for="email" class="block text-sm font-medium text-stone-700 mb-2">
                Email Address
              </label>
              <input
                id="email"
                type="email"
                formControlName="email"
                class="w-full px-4 py-2 border border-stone-300 rounded-lg bg-stone-100 cursor-not-allowed"
                [disabled]="true"
              />
              <p class="mt-1 text-xs text-stone-500">Email cannot be changed</p>
            </div>

            <!-- Phone -->
            <div>
              <label for="phone" class="block text-sm font-medium text-stone-700 mb-2">
                Phone Number
              </label>
              <input
                id="phone"
                type="tel"
                formControlName="phone"
                placeholder="+1 (555) 123-4567"
                class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-leather-primary focus:border-transparent"
              />
            </div>

            <!-- Birthday -->
            <div>
              <label for="birthday" class="block text-sm font-medium text-stone-700 mb-2">
                Birthday
              </label>
              <input
                id="birthday"
                type="date"
                formControlName="birthday"
                class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-leather-primary focus:border-transparent"
              />
            </div>

            <!-- Address (full width) -->
            <div class="md:col-span-2">
              <label for="address" class="block text-sm font-medium text-stone-700 mb-2">
                Address
              </label>
              <textarea
                id="address"
                formControlName="address"
                rows="3"
                placeholder="Enter your full address"
                class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-leather-primary focus:border-transparent resize-none"
              ></textarea>
            </div>
          </div>

          <!-- Save Button -->
          <div class="mt-6 flex justify-end">
            <button
              type="submit"
              [disabled]="profileForm.invalid || loading"
              class="px-6 py-2 bg-leather-primary text-white rounded-lg hover:bg-leather-secondary transition-colors disabled:bg-stone-400 disabled:cursor-not-allowed flex items-center space-x-2"
            >
              <span *ngIf="loading" class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
              <span>{{ loading ? 'Saving...' : 'Save Changes' }}</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Payment Methods Section -->
      <div class="bg-white rounded-lg shadow p-6">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-semibold text-stone-900">Payment Methods</h2>
          <button
            type="button"
            class="px-4 py-2 bg-leather-primary text-white rounded-lg hover:bg-leather-secondary transition-colors flex items-center space-x-2"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            <span>Add Card</span>
          </button>
        </div>

        <!-- Payment Cards List -->
        <div class="space-y-4">
          <p class="text-stone-500 text-center py-8">No payment methods saved yet</p>

          <!-- Example card (will be populated dynamically) -->
          <!-- <div class="border border-stone-200 rounded-lg p-4 flex items-center justify-between">
            <div class="flex items-center space-x-4">
              <svg class="w-12 h-8 text-stone-400" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>
              </svg>
              <div>
                <p class="font-medium text-stone-900">•••• •••• •••• 4242</p>
                <p class="text-sm text-stone-500">Expires 12/25</p>
              </div>
            </div>
            <button class="text-red-600 hover:text-red-800 transition-colors">
              Remove
            </button>
          </div> -->
        </div>
      </div>

      <!-- Quick Links Section -->
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold text-stone-900 mb-4">Quick Links</h2>
        <div class="space-y-3">
          <a
            routerLink="/orders"
            class="flex items-center justify-between p-4 border border-stone-200 rounded-lg hover:bg-stone-50 transition-colors group"
          >
            <div class="flex items-center space-x-3">
              <svg class="w-6 h-6 text-stone-600 group-hover:text-leather-primary transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
              </svg>
              <div>
                <p class="font-medium text-stone-900">Order History</p>
                <p class="text-sm text-stone-500">View your past orders</p>
              </div>
            </div>
            <svg class="w-5 h-5 text-stone-400 group-hover:text-leather-primary transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
