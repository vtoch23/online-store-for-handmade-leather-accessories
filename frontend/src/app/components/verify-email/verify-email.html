<div class="min-h-screen bg-stone-50 flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
    <!-- Verifying spinner -->
    <div *ngIf="verifying" class="text-center">
      <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-amber-600 mx-auto mb-4"></div>
      <h2 class="text-2xl font-bold text-stone-800 mb-2">Verifying Your Email</h2>
      <p class="text-stone-600">Please wait while we verify your email address...</p>
    </div>

    <!-- Success message -->
    <div *ngIf="!verifying && success" class="text-center">
      <div class="mb-4">
        <svg class="mx-auto h-16 w-16 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-stone-800 mb-2">Email Verified!</h2>
      <p class="text-stone-600 mb-6">Your email has been successfully verified. You can now log in to your account.</p>
      <p class="text-sm text-stone-500">Redirecting to login page in 3 seconds...</p>
      <button
        (click)="goToLogin()"
        class="mt-4 w-full bg-amber-600 text-white py-2 px-4 rounded-md hover:bg-amber-700 transition duration-200">
        Go to Login Now
      </button>
    </div>

    <!-- Error message -->
    <div *ngIf="!verifying && !success" class="text-center">
      <div class="mb-4">
        <svg class="mx-auto h-16 w-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-stone-800 mb-2">Verification Failed</h2>
      <p class="text-red-600 mb-6">{{ errorMessage }}</p>
      <button
        (click)="goToLogin()"
        class="w-full bg-amber-600 text-white py-2 px-4 rounded-md hover:bg-amber-700 transition duration-200">
        Go to Login
      </button>
    </div>
  </div>
</div>
