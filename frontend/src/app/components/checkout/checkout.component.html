<div class="checkout-container">
  <div class="container">
    <h1>Checkout</h1>

    <div class="checkout-content">
      <div class="checkout-form">
        <h2>Shipping Information</h2>

        <div *ngIf="error" class="error-message">
          {{ error }}
        </div>

        <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input
              type="text"
              id="fullName"
              formControlName="fullName"
              [class.invalid]="checkoutForm.get('fullName')?.invalid && checkoutForm.get('fullName')?.touched">
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input
              type="email"
              id="email"
              formControlName="email"
              [class.invalid]="checkoutForm.get('email')?.invalid && checkoutForm.get('email')?.touched">
          </div>

          <div class="form-group">
            <label for="address">Address *</label>
            <input
              type="text"
              id="address"
              formControlName="address"
              [class.invalid]="checkoutForm.get('address')?.invalid && checkoutForm.get('address')?.touched">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="city">City *</label>
              <input
                type="text"
                id="city"
                formControlName="city"
                [class.invalid]="checkoutForm.get('city')?.invalid && checkoutForm.get('city')?.touched">
            </div>

            <div class="form-group">
              <label for="postalCode">Postal Code *</label>
              <input
                type="text"
                id="postalCode"
                formControlName="postalCode"
                [class.invalid]="checkoutForm.get('postalCode')?.invalid && checkoutForm.get('postalCode')?.touched">
            </div>
          </div>

          <div class="form-group">
            <label for="country">Country *</label>
            <input
              type="text"
              id="country"
              formControlName="country"
              [class.invalid]="checkoutForm.get('country')?.invalid && checkoutForm.get('country')?.touched">
          </div>

          <button
            type="submit"
            class="submit-btn"
            [disabled]="checkoutForm.invalid || submitting">
            {{ submitting ? 'Processing...' : 'Place Order' }}
          </button>
        </form>
      </div>

      <div class="order-summary">
        <h2>Order Summary</h2>

        <div class="summary-items">
          <div *ngFor="let item of cartItems" class="summary-item">
            <div class="item-info">
              <p class="item-name">{{ item.product.name }}</p>
              <p class="item-quantity">Qty: {{ item.quantity }}</p>
            </div>
            <p class="item-price">${{ (item.product.price * item.quantity).toFixed(2) }}</p>
          </div>
        </div>

        <div class="summary-total">
          <span>Total:</span>
          <span class="total-amount">${{ total.toFixed(2) }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
