<header class="bg-leather-brown text-white shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <nav class="flex justify-between items-center h-16">
      <a routerLink="/" class="text-2xl font-semibold hover:text-leather-accent transition-colors">
        Leather Accessories
      </a>
      <ul class="flex items-center space-x-6">
        <li>
          <a routerLink="/" routerLinkActive="text-leather-accent" [routerLinkActiveOptions]="{exact: true}"
             class="hover:text-leather-accent transition-colors font-medium">
            Shop
          </a>
        </li>
        <li>
          <a routerLink="/cart" routerLinkActive="text-leather-accent"
             class="relative hover:text-leather-accent transition-colors font-medium">
            Cart
            <span *ngIf="(cartItemCount$ | async) as count"
                  class="absolute -top-2 -right-3 bg-leather-accent text-leather-brown text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">
              {{ count }}
            </span>
          </a>
        </li>
        <ng-container *ngIf="currentUser$ | async as user; else notLoggedIn">
          <li class="relative">
            <button (click)="toggleProfileDropdown()"
                    class="flex items-center space-x-2 hover:text-leather-accent transition-colors">
              <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div *ngIf="isProfileDropdownOpen"
                 class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl py-2 z-50 text-stone-800">
              <div class="px-4 py-2 border-b border-stone-200">
                <p class="text-sm font-medium">{{ user.full_name || 'User' }}</p>
                <p class="text-xs text-stone-500">{{ user.email }}</p>
              </div>
              <a routerLink="/profile" (click)="closeDropdown()"
                 class="block px-4 py-2 hover:bg-stone-100 transition-colors">
                Profile
              </a>
              <a routerLink="/orders" (click)="closeDropdown()"
                 class="block px-4 py-2 hover:bg-stone-100 transition-colors">
                Past Orders
              </a>
              <button (click)="logout()"
                      class="w-full text-left px-4 py-2 hover:bg-stone-100 transition-colors text-red-600">
                Logout
              </button>
            </div>
          </li>
        </ng-container>
        <ng-template #notLoggedIn>
          <li>
            <a routerLink="/login"
               class="px-4 py-2 border border-white rounded-lg hover:bg-white hover:text-leather-brown transition-all font-medium">
              Login
            </a>
          </li>
          <li>
            <a routerLink="/register"
               class="px-4 py-2 bg-leather-accent text-leather-brown rounded-lg hover:bg-opacity-90 transition-all font-medium">
              Sign Up
            </a>
          </li>
        </ng-template>
      </ul>
    </nav>
  </div>
</header>
